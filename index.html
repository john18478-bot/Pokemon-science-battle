<body>
<div id="app">
<header><div class="logo"><i>⚡</i> 寶可夢科學對戰</div><span class="headerStatus" id="headerStatus">比卡超 VS 超夢 · 小五科學</span><div class="tools"><button class="tool" id="soundBtn" title="音效" aria-label="音效開關">♪ 音效</button><button class="tool" id="musicBtn" title="背景音樂" aria-label="背景音樂開關">♫ 音樂</button><button class="tool" id="motionBtn" title="減少動畫">動態</button><button class="tool" id="pauseBtn" title="暫停">⏸ 暫停</button><button class="tool" id="skipBtn" title="跳過攻擊動畫">⏭ 跳過</button><button class="tool" id="fullBtn" title="全螢幕">⛶ 全螢幕</button><button class="tool" id="restartBtn" title="重新開始">↻ 重開</button></div></header>
<div class="arena" id="arena"><canvas id="scene" width="480" height="250" role="img" aria-label="復古像素戰鬥場景，比卡超在近方草地，超夢在遠方平台"></canvas><div class="battleTint"></div>
<div class="hud enemy"><div class="hudTop"><div class="hudTitle" id="enemyName">B組｜超夢</div><div class="level">Lv. 50</div></div><div class="hpRow"><span class="tiny">HP</span><div class="hpTrack"><div class="hpFill" id="enemyFill"></div></div></div><div class="hudFoot"><span id="enemyHp">120 / 120</span><span class="energy" id="enemyEnergy" aria-label="超夢技能能量 0 / 6"></span></div></div>
<div class="hud hero"><div class="hudTop"><div class="hudTitle" id="heroName">A組｜比卡超</div><div class="level">Lv. 50</div></div><div class="hpRow"><span class="tiny">HP</span><div class="hpTrack"><div class="hpFill" id="heroFill"></div></div></div><div class="hudFoot"><span id="heroHp">120 / 120</span><span class="energy" id="heroEnergy" aria-label="比卡超技能能量 0 / 6"></span></div></div>
<div class="turnFlag" id="turnFlag" role="status">小五科學對戰</div><div class="battleMsg" id="battleMsg" aria-live="polite"></div></div>
<div class="battlePanel"><section class="promptBox" id="promptBox" aria-live="polite"><div class="promptHead"><span>科學對戰</span> 選擇開始遊戲</div><div class="promptTitle">透過科學知識，為寶可夢儲蓄能量！</div><div class="promptSub">每組 5 題 · 每題最多作答兩次</div></section><section class="choiceBox" id="choiceBox"></section></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="遊戲選單"></div><div class="pauseMask" id="pauseMask" role="button" tabindex="0" aria-label="繼續戰鬥">⏸ 戰鬥暫停<span>按此或按上方「繼續」返回戰鬥</span></div><div class="toast" id="toast"></div>
</div>
<script>
'use strict';
/* ==================== 教師可編輯題庫（10題、解說、分類） ==================== */
const QUESTION_BANK = [
 {id:1,topic:'消化系統',question:'身體將食物分解成較簡單的物質，以便被身體吸收，這個過程稱為甚麼？',options:['吸收','消化','排泄','呼吸'],correct:1,explain:'消化是將食物分解成較簡單物質的過程，讓身體能夠吸收當中的養分。'},
 {id:2,topic:'消化系統',question:'以下哪一項是保護消化系統的良好習慣？',options:['經常暴飲暴食','進食後立即進行劇烈運動','進食前先洗手','經常吃不潔的食物'],correct:2,explain:'進食前洗手有助減少病菌經食物進入消化系統的機會。'},
 {id:3,topic:'消化系統',question:'如果長期只吃肉類而不吃蔬菜，最容易出現以下哪種問題？',options:['因缺乏膳食纖維而便秘','骨骼立即停止生長','肺部無法吸入空氣','胃部不再分泌胃液'],correct:0,explain:'蔬菜含有膳食纖維，缺乏膳食纖維會增加便秘的機會。'},
 {id:4,topic:'呼吸系統',question:'以下哪種方法最有助保護呼吸系統？',options:['經常吸入二手煙','在多塵環境中不作防護','長期留在空氣不流通的地方','遠離煙霧，保持空氣流通'],correct:3,explain:'避免吸入煙霧和污染物，有助保護呼吸道及肺部。'},
 {id:5,topic:'呼吸系統',question:'咽在人體內的主要作用是甚麼？',options:['讓食物和空氣通過','分泌胃液','吸收食物的養分','進行氧氣與二氧化碳的交換'],correct:0,explain:'咽是食物和空氣都會經過的通道。'},
 {id:6,topic:'呼吸系統',question:'肺部的主要功能是甚麼？',options:['將食物分解','製造血液','進行氣體交換','儲存食物'],correct:2,explain:'肺部透過肺泡進行氣體交換，讓氧氣進入血液，並將二氧化碳排出。'},
 {id:7,topic:'消化系統',question:'胃液的主要作用是甚麼？',options:['吸收所有養分','幫助分解部分蛋白質','把食物直接轉化為血液','把氧氣輸送到身體各部分'],correct:1,explain:'胃液含有胃酸和消化酶，有助分解蛋白質。'},
 {id:8,topic:'消化系統',question:'經常飲用過熱的飲品，可能對身體造成甚麼傷害？',options:['令肺部失去彈性','令牙齒立即脫落','令腸道停止蠕動','灼傷口腔和食道'],correct:3,explain:'過熱的飲品可能灼傷口腔及食道黏膜。'},
 {id:9,topic:'呼吸系統',question:'吸氣和呼氣時，胸部會出現甚麼變化？',options:['吸氣時胸部收縮，呼氣時擴張','吸氣和呼氣時胸部都不會改變','吸氣時胸部擴張，呼氣時收縮','吸氣和呼氣時胸部都只會擴張'],correct:2,explain:'吸氣時胸腔容積增大，呼氣時胸腔容積減小。'},
 {id:10,topic:'消化系統',question:'在口腔裏，食物被牙齒咬碎後，會與甚麼混和？',options:['膽汁','唾液','胃液','血液'],correct:1,explain:'唾液能濕潤食物，當中的消化酶亦能開始分解澱粉。'}
];
const MOVESETS={
 A:[{id:'quick',name:'電光一閃',en:'Quick Attack',damage:14,cost:0,duration:2150,hit:.53},{id:'shock',name:'電擊',en:'Thunder Shock',damage:18,cost:1,duration:2800,hit:.60},{id:'bolt',name:'十萬伏特',en:'Thunderbolt',damage:23,cost:2,duration:3400,hit:.62},{id:'volt',name:'伏特攻擊',en:'Volt Tackle',damage:30,cost:4,duration:3950,hit:.72}],
 B:[{id:'confusion',name:'念力',en:'Confusion',damage:14,cost:0,duration:2500,hit:.60},{id:'psychic',name:'精神強念',en:'Psychic',damage:18,cost:1,duration:3180,hit:.62},{id:'aura',name:'波導彈',en:'Aura Sphere',damage:23,cost:2,duration:3360,hit:.69},{id:'psystrike',name:'精神擊破',en:'Psystrike',damage:30,cost:4,duration:4050,hit:.75}]
};
const S={MAIN_MENU:'MAIN_MENU',TEAM_SETUP:'TEAM_SETUP',BATTLE_INTRO:'BATTLE_INTRO',QUESTION:'QUESTION',RETRY:'RETRY',ANSWER_FEEDBACK:'ANSWER_FEEDBACK',SKILL_SELECT:'SKILL_SELECT',ATTACK:'ATTACK',DAMAGE:'DAMAGE',TURN_END:'TURN_END',GAME_OVER:'GAME_OVER',REVIEW:'REVIEW'};
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false});
ctx.setTransform(.5,0,0,.5,0,0);ctx.imageSmoothingEnabled=false;
const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
const mix=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const shuffle=arr=>{let copy=[...arr];for(let i=copy.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L='ABCD';
function makeTeam(id,name){return{id,name,mon:id==='A'?'比卡超':'超夢',hp:120,displayHp:120,energy:0,stats:{first:0,second:0,failed:0,attacks:0,totalDamage:0,skills:[]},fainted:false}}
const game={state:S.MAIN_MENU,outro:null,faintTime:0,teams:{A:makeTeam('A','A 組'),B:makeTeam('B','B 組')},queue:[],index:0,active:'A',attempt:0,wrongChoice:null,pendingAnswer:null,feedback:null,reviewOnly:false,koWinner:null,animation:null,pendingMove:null,paused:false,clock:0,particles:[],scenePulse:0,damageFloat:null,settings:{sound:true,music:false,reduced:false},selectedStarter:'random',initialNames:{A:'A 組',B:'B 組'}};
let lastTime=performance.now(),lastUiRefresh=0,canvasShake=0,toastHide=0;
function currentEntry(){return game.queue[game.index]}
function activeTeam(){return game.teams[game.active]}
function otherId(id){return id==='A'?'B':'A'}
function makeQueue(starter){
 let digest=shuffle(QUESTION_BANK.filter(q=>q.topic==='消化系統'));
 let breath=shuffle(QUESTION_BANK.filter(q=>q.topic==='呼吸系統'));
 let qa=shuffle([...digest.slice(0,3),...breath.slice(0,2)]),qb=shuffle([...digest.slice(3),...breath.slice(2)]);
 let entries=[];for(let i=0;i<5;i++)for(const team of [starter,otherId(starter)]){
  const q=(team==='A'?qa:qb)[i],options=shuffle(q.options.map((text,origin)=>({text,origin})));
  entries.push({team,q,options,correct:options.findIndex(o=>o.origin===q.correct),attempts:[],result:null});
 }return entries;
}
function setState(next){game.state=next;renderUI();updateHud()}
function startGame(){
 unlockAudio();game.teams.A=makeTeam('A',game.initialNames.A.trim().slice(0,18)||'A 組');game.teams.B=makeTeam('B',game.initialNames.B.trim().slice(0,18)||'B 組');
 game.index=0;game.previewSetup=false;game.pendingMove=null;game.outro=null;game.faintTime=0;game.attempt=0;game.pendingAnswer=null;game.feedback=null;game.wrongChoice=null;game.reviewOnly=false;game.koWinner=null;game.animation=null;game.paused=false;game.particles=[];game.damageFloat=null;
 let starter=game.selectedStarter==='random'?(Math.random()<.5?'A':'B'):game.selectedStarter;
 game.queue=makeQueue(starter);game.active=starter;$('pauseMask').classList.remove('show');$('pauseBtn').textContent='⏸ 暫停';showOverlay('');setState(S.BATTLE_INTRO);playSound('start');
 game.introEnd=game.clock+950;
}
function showOverlay(html){const o=$('overlay');if(!html){o.classList.add('hidden');o.innerHTML='';$('promptBox').inert=false;$('choiceBox').inert=false;return}o.innerHTML=html;o.classList.remove('hidden');$('promptBox').inert=true;$('choiceBox').inert=true}
function resetPreview(){game.queue=[];game.index=0;game.active='A';for(const id of ['A','B'])game.teams[id]=makeTeam(id,game.initialNames[id]);}
function overlayMenu(){resetPreview();game.previewSetup=true;game.faintTime=0;for(const t of Object.values(game.teams))t.fainted=false;setState(S.MAIN_MENU);showOverlay(`<div class="modal"><h1>⚡ 寶可夢科學對戰</h1><p>經典掌機風格 · 兩組科學問答 RPG</p><div class="menuCharacters"><div class="pName a">A 組<br>比卡超</div><div class="versus">VS</div><div class="pName b">B 組<br>超夢</div></div><p>10 道小五科學題目 · 雙方各有 5 次作答機會<br>首次答對獲得 2 能量；再次答對獲得 1 能量。</p><div class="modalActions"><button class="primary" data-action="setup">開始科學對戰 ▶</button><button class="secondary" data-action="rules">對戰玩法</button></div><p class="setupNote">所有角色畫面及音效均由本檔案繪製及生成，無須連線。</p></div>`)}
function overlaySetup(){resetPreview();game.pendingMove=null;game.animation=null;game.outro=null;game.paused=false;game.damageFloat=null;game.particles=[];game.faintTime=0;game.koWinner=null;for(const t of Object.values(game.teams))t.fainted=false;game.previewSetup=true;setState(S.TEAM_SETUP);showOverlay(`<div class="modal"><h2>⚔️ 對戰設定</h2><div class="inputGrid"><label class="fieldLabel">A 組名稱（比卡超）<input id="teamAInput" maxlength="18" value="${esc(game.initialNames.A)}"></label><label class="fieldLabel">B 組名稱（超夢）<input id="teamBInput" maxlength="18" value="${esc(game.initialNames.B)}"></label><label class="fieldLabel" style="grid-column:1/-1">先手設定<select id="starterSelect"><option value="random">隨機決定先手</option><option value="A">A 組先手（比卡超）</option><option value="B">B 組先手（超夢）</option></select></label></div><p class="setupNote">雙方 HP：120｜技能能量：0｜各 5 題，最多兩次嘗試。選答案後需確認，避免誤觸。</p><div class="modalActions"><button class="secondary" data-action="menu">返回</button><button class="primary" data-action="begin">進入戰場 ▶</button></div></div>`);$('starterSelect').value=game.selectedStarter}
function showRules(){showOverlay(`<div class="modal wide"><h2>科學知識，就是對戰能量！</h2><div class="ruleGrid"><div><h3>① 兩組輪流答題</h3><p>共 5 個大回合、10 道題。每組各答 5 題：3 題消化系統、2 題呼吸系統。題目及選項隨機排列，同局不重複。</p><h3>② 答對後選擇絕招</h3><p>首次答對：+2 能量，100% 傷害。<br>第二次答對：+1 能量，75% 傷害，四捨五入。<br>兩次答錯：顯示解說，交給下一組。<br>技能能量最多 6 點；不用急，答題沒有時限。</p></div><div><h3>③ 雙方技能數值完全相同</h3><table class="scoreTable"><tr><th>技能級別</th><th>傷害</th><th>能量</th></tr><tr><td>第一招</td><td>14</td><td>0</td></tr><tr><td>第二招</td><td>18</td><td>1</td></tr><tr><td>第三招</td><td>23</td><td>2</td></tr><tr><td>第四招</td><td>30</td><td>4</td></tr></table><p>本課堂遊戲不計屬性相剋、暴擊、閃避、反作用傷害或附加狀態；所有技能必定命中。</p></div></div><p><strong>完成 10 題後，比較剩餘 HP；相同則比較首次答對題數，再相同為平手。</strong><br>如 HP 提早歸零，會保留「完成剩餘科學題目」模式。答錯一次的題目也會收錄在「錯題重溫」。</p><p class="setupNote">操作：選擇答案／技能後再確認。動畫結束後，按「下一回合」。可使用 1–4 或 A–D 選項；空白鍵暫停。音樂為原創復古旋律，需先按一下畫面才能播放。</p><div class="modalActions">${actionBtn('返回主畫面','menu','secondary')}${actionBtn('開始對戰 ▶','setup')}</div></div>`)}
function updateSettingsButtons(){syncAudio();for(const [id,v] of [['soundBtn',game.settings.sound],['musicBtn',game.settings.music],['motionBtn',!game.settings.reduced]]){$(id).setAttribute('aria-pressed',String(v))};$('motionBtn').textContent=game.settings.reduced?'動效：少':'動效：全';$('pauseBtn').disabled=[S.MAIN_MENU,S.TEAM_SETUP,S.GAME_OVER,S.REVIEW].includes(game.state);$('skipBtn').disabled=game.paused||![S.ATTACK,S.DAMAGE,S.BATTLE_INTRO].includes(game.state)}
function updateHud(){
 for(const [key,tag] of [['A','hero'],['B','enemy']]){
  let t=game.teams[key],hp=Math.max(0,Math.round(t.displayHp));$(tag+'Name').textContent=`${t.name}｜${t.mon}`;$(tag+'Hp').textContent=`${hp} / 120`;
  $(tag+'Energy').setAttribute('aria-label',`技能能量 ${t.energy} / 6`);const bar=$(tag+'Fill');bar.style.width=`${100*clamp(hp/120)}%`;bar.style.background=hp>60?'linear-gradient(#a4ff85,#36b75d)':hp>24?'linear-gradient(#ffed72,#dfae2d)':'linear-gradient(#fc8b80,#ce3d4d)';
  $(tag+'Energy').innerHTML=Array.from({length:6},(_,i)=>`<span class="pip ${i<t.energy?'on':''}"></span>`).join('');
 }
 let turn=game.queue.length?Math.min(game.index+1,10):0;
 $('headerStatus').textContent=[S.MAIN_MENU,S.TEAM_SETUP].includes(game.state)?'比卡超 VS 超夢 · 小五科學':`第 ${turn}/10 題　｜　${game.teams.A.name} 對戰 ${game.teams.B.name}`;
 const flag=$('turnFlag');flag.textContent=game.state===S.MAIN_MENU||game.state===S.TEAM_SETUP?'小五科學 × 寶可夢':game.state===S.GAME_OVER?'戰鬥結束':`${game.teams[game.active].name} · 第 ${Math.floor(game.index/2)+1}/5 回合`;
 flag.className='turnFlag '+(game.active==='A'?'a':'b');updateSettingsButtons();
}
function prompt(head,title,sub=''){$('promptBox').innerHTML=`<div class="promptHead"><span>${esc(head)}</span>${esc(game.teams[game.active].mon)} · ${esc(game.teams[game.active].name)}</div><div class="promptTitle">${esc(title)}</div><div class="promptSub">${esc(sub)}</div>`}
function setChoices(html){$('choiceBox').innerHTML=html}
function actionBtn(text,action,klass='primary'){return `<button class="${klass}" data-action="${action}">${esc(text)}</button>`}
function renderUI(){
 $('app').setAttribute('data-state',game.state);updateHud();const e=currentEntry(),t=activeTeam(),state=game.state;
 if(state===S.MAIN_MENU||state===S.TEAM_SETUP){prompt('遊戲規則','用科學知識發動寶可夢絕招！','兩組輪流作答，雙方公平對戰。');setChoices(`<div class="panelActions">${actionBtn('開始遊戲','setup')}</div>`);return}
 if(state===S.BATTLE_INTRO){prompt('對戰開始',`${game.teams.A.name} 的比卡超 VS ${game.teams.B.name} 的超夢！`,'即將進入第一道科學題。');setChoices('<div class="panelActions"><span class="bigMessage">準備開始！</span></div>');return}
 if(state===S.QUESTION||state===S.RETRY){
 const h=`科學問題 ${game.index+1}/10 · ${e.q.topic}`,sub=state===S.RETRY?'第一次答錯了！剩下最後一次機會；再次答對可得 1 能量，傷害為 75%。':'首次答對可得 2 能量，使用技能時造成 100% 傷害。';
 prompt(h,e.q.question,sub);
 if(game.pendingAnswer!==null){let p=e.options[game.pendingAnswer];setChoices(`<div class="panelActions"><div class="bigMessage" style="font-size:18px">確認答案：${L[game.pendingAnswer]}. ${esc(p.text)}</div>${actionBtn('返回修改','cancelAnswer','secondary')}${actionBtn('確定提交','confirmAnswer')}</div>`);return}
 setChoices(e.options.map((o,i)=>`<button class="choice ${i===game.wrongChoice?'wrong':''}" data-answer="${i}" ${i===game.wrongChoice?'disabled':''}><span class="key">${L[i]}</span><span>${esc(o.text)}</span></button>`).join(''));return;
 }
 if(state===S.ANSWER_FEEDBACK){
 let f=game.feedback;prompt(f.success?'答題成功！':'這題需要再溫習',`${f.success?'✓ 答對了！':'✕ 兩次都未答對。'} ${e.q.explain}`,`正確答案：${L[e.correct]}. ${e.options[e.correct].text}${f.success?`　｜　能量 +${f.gain}`:'　｜　本回合無法攻擊'}`);
 const label=game.reviewOnly?'下一題 ▶':f.success?'選擇絕招 ▶':'下一回合 ▶';setChoices(`<div class="panelActions"><span class="bigMessage" style="font-size:20px">${f.success?`能量 ${t.energy} / 6`:'再接再厲！'}</span>${actionBtn(label,'feedbackNext')}</div>`);return;
 }
 if(state===S.SKILL_SELECT){prompt('選擇技能',`${t.mon} 準備攻擊！` ,`可用能量：${t.energy}/6 ｜ ${game.feedback.first?'首次答對：100% 傷害':'第二次答對：75% 傷害'}`);
 if(game.pendingMove!==null){const m=MOVESETS[game.active][game.pendingMove],d=Math.round(m.damage*(game.feedback.first?1:.75));
 setChoices(`<div class="panelActions"><div class="confirmTitle">${esc(t.mon)} 使用「${m.name}」？<small>傷害 ${d} HP　／　消耗 ${m.cost} 能量</small></div>${actionBtn('返回選招','cancelMove','secondary')}${actionBtn('確定發動 ▶','confirmMove')}</div>`);return;}
 setChoices(MOVESETS[game.active].map((s,i)=>{let available=t.energy>=s.cost,dmg=Math.round(s.damage*(game.feedback.first?1:.75));return `<button class="choice" data-move="${i}" ${!available?'disabled':''}><span class="key">${i+1}</span><span class="skillInfo"><span class="skillName">${esc(s.name)}</span><span class="skillMeta">傷害 ${dmg}　⚡ 能量 ${s.cost}${!available?' · 不足':''}</span></span></button>`}).join(''));return;
 }

function fxPsychic(c,a,p,now){
 if(p>.12&&p<.85){let strength=p<.5?ease((p-.12)/.38):1-clamp((p-.78)/.1);c.fillStyle=`rgba(137,64,203,${strength*.1})`;c.fillRect(0,0,960,500);
 for(let j=0;j<6;j++){let row=165+j*24;let points=[];for(let x=100;x<=850;x+=14){let warp=Math.sin(x*.023-now*.009+j*.65)*13*strength;points.push([x,row+warp])}line(c,points,j%2?'rgba(230,157,255,.7)':'rgba(137,74,224,.7)',3+j%3)}
 for(let i=0;i<9;i++){let k=clamp((p-.27-i*.045)/.4),x=mix(684,304,k),y=mix(171,306,k);ring(c,x,y,7+Math.sin(now*.015+i)*6+22*k,i%2?'#d9a5ff':'#956be4',2.7);}
 if(p>.59&&p<.88){for(let i=0;i<8;i++){let theta=now*.008+i*.8;line(c,[[292+Math.cos(theta)*8,302+Math.sin(theta)*10],[292+Math.cos(theta)*65,302+Math.sin(theta)*65]],'#b986ed',3)}}
 }

function fxAura(c,a,p,now){
 let start=[661,160],end=[291,298];if(p>.12&&p<.68){let r=9+ease((p-.12)/.43)*36;let grad=c.createRadialGradient(start[0],start[1],3,start[0],start[1],r);grad.addColorStop(0,'#fbffff');grad.addColorStop(.25,'#b1fdff');grad.addColorStop(.6,'#3eadef');grad.addColorStop(1,'rgba(31,113,248,0)');c.fillStyle=grad;circle(c,start[0],start[1],r,'#91eeff');c.fillStyle=grad;c.beginPath();c.arc(start[0],start[1],r,0,Math.PI*2);c.fill();
 for(let i=0;i<10;i++){let theta=now*.007+i*.628;rect(c,start[0]+Math.cos(theta)*r,start[1]+Math.sin(theta)*r,5,5,i%2?'#fff':'#63d6ff')}}
 if(p>.47&&p<.88){let f=ease((p-.48)/.22),x=mix(start[0],end[0],f),y=mix(start[1],end[1],f)-Math.sin(f*Math.PI)*37;
 for(let i=7;i>=1;i--){let prior=clamp(f-i*.055),px=mix(start[0],end[0],prior),py=mix(start[1],end[1],prior)-Math.sin(prior*Math.PI)*37;circle(c,px,py,7+(8-i)*1.3,`rgba(87,194,246,${.52-i*.05})`)}
 const grad=c.createRadialGradient(x,y,0,x,y,47);grad.addColorStop(0,'#fff');grad.addColorStop(.28,'#99f8ff');grad.addColorStop(.68,'#3bb5ff');grad.addColorStop(1,'rgba(23,78,255,0)');c.fillStyle=grad;c.beginPath();c.arc(x,y,47,0,Math.PI*2);c.fill();
 for(let i=0;i<12;i++){let th=now*.013+i*.523;rect(c,x+Math.cos(th)*34,y+Math.sin(th)*27,6,6,'#d1ffff')}}
 if(p>.65&&p<.95){let r=(p-.65)*390;ring(c,292,296,r,'#93edff',6);radial(c,292,295,55+r*.45,['#e4ffff','#45cbff','#8babff'],16,11)}

function fxPsystrike(c,a,p,now){
 if(p>.1&&p<.84){for(let i=0;i<36;i++){let th=i*2.399+now*.0009,r=30+(i%9)*17,x=718+Math.cos(th)*r,y=149+Math.sin(th)*r*.8;rect(c,x,y,i%3?5:8,i%3?5:8,i%3?'#b76aff':'#e8b1ff')}
 for(let i=0;i<6;i++){let st=.2+i*.07,flight=clamp((p-st)/.38);let ox=652+(i-2.5)*46,oy=40+(i%3)*23,x=mix(ox,293,flight),y=mix(oy,290,flight)-Math.sin(flight*Math.PI)*45;
 let r=15+(i%3)*7,glow=c.createRadialGradient(x,y,1,x,y,r*1.8);glow.addColorStop(0,'#fff');glow.addColorStop(.35,'#e1a1fa');glow.addColorStop(.7,'#a64edb');glow.addColorStop(1,'rgba(125,25,179,0)');c.fillStyle=glow;c.beginPath();c.arc(x,y,r*1.8,0,Math.PI*2);c.fill();ring(c,x,y,r*.73,'rgba(255,211,255,.9)',3);
 for(let j=0;j<4;j++){let th=now*.011+j*Math.PI/2+i;rect(c,x+Math.cos(th)*r,y+Math.sin(th)*r,5,6,'#eecbff')}

function drawAttackFX(c,a,p,now){c.save();c.globalCompositeOperation='source-over';switch(a.move.id){case 'quick':fxQuick(c,a,p,now);break;case 'shock':fxShock(c,a,p,now);break;case 'bolt':fxBolt(c,a,p,now);break;case 'volt':fxVolt(c,a,p,now);break;case 'confusion':fxConfusion(c,a,p,now);break;case 'psychic':fxPsychic(c,a,p,now);break;case 'aura':fxAura(c,a,p,now);break;case 'psystrike':fxPsystrike(c,a,p,now);break;}c.restore()}
/* ==================== Canvas particles and game loop ==================== */
function burst(x,y,n,colors){n=game.settings.reduced?Math.min(n,8):n;for(let i=0;i<n;i++){let angle=Math.random()*Math.PI*2,speed=40+Math.random()*225,life=.45+Math.random()*1;
 game.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-54,size:3+Math.floor(Math.random()*5),color:colors[i%colors.length],rot:Math.random()*5,vr:(Math.random()-.5)*9,life,maxLife:life});}
 if(game.particles.length>380)game.particles.splice(0,game.particles.length-380)}
function particleTick(dt){for(let i=game.particles.length-1;i>=0;i--){let p=game.particles[i];p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=150*dt/1000;p.vx*=.992;p.rot+=p.vr*dt/1000;p.life-=dt/1000;if(p.life<=0)game.particles.splice(i,1)}}
function fireEvent(a,label,threshold,fn,p){if(p>=threshold&&!a.events.has(label)){a.events.add(label);fn()}}
function stepAttack(dt){const a=game.animation;if(!a)return;a.elapsed+=dt;let p=attackProgress(a);
 fireEvent(a,'charge',.12,()=>{playSound(['quick','volt','shock','bolt'].includes(a.move.id)?'chargeElectric':'chargePsychic');let src=a.from==='A'?[290,289]:[716,150];burst(...src,13,a.from==='A'?['#fff2aa','#ffe54b']:['#e3aeff','#aa78ef'])},p);
 fireEvent(a,'launch',.41,()=>{playSound(a.move.id);let src=a.from==='A'?[362,279]:[666,172];burst(...src,18,a.from==='A'?['#fff1a7','#ffce2e','#9be9fb']:['#d08dfb','#7baaff','#f0c4fc'])},p);
 if(p>=a.move.hit&&!a.hit){applyHit(a);a.hitTime=game.clock}
 if(a.hit){let t=clamp((a.elapsed-a.hitAt)/Math.max(220,game.settings.reduced?170:570));game.teams[a.to].displayHp=mix(a.fromHP,a.toHP,ease(t))}
 if(a.elapsed>=a.duration)finishAttack();
}
function setBattleMsg(){let el=$('battleMsg'),a=game.animation;if([S.ATTACK,S.DAMAGE].includes(game.state)&&a){el.textContent=`${game.teams[a.from].mon}使用了${a.move.name}！`;el.classList.toggle('show',a.elapsed<760)}else if(game.state===S.GAME_OVER&&game.outro){let w=winnerId();el.textContent=w?`${game.teams[w].name} 勝利！`:'勢均力敵！';el.classList.add('show')}else el.classList.remove('show')}
function loop(ts){const dt=Math.min(60,ts-lastTime||0);lastTime=ts;
 if(!game.paused){game.clock+=dt;particleTick(dt);game.scenePulse=Math.max(0,game.scenePulse-dt*.0007);canvasShake=Math.max(0,canvasShake-dt*.028);
 if(game.state===S.BATTLE_INTRO&&game.clock>=game.introEnd)startQuestion();
 if(game.state===S.ATTACK||game.state===S.DAMAGE)stepAttack(dt);
 if(game.outro&&game.clock-game.outro.started>=game.outro.duration)showResults();
 if(toastHide&&game.clock>toastHide){$('toast').classList.remove('show');toastHide=0}
 }
 renderWorld(game.clock);setBattleMsg();if(ts-lastUiRefresh>60){updateHud();lastUiRefresh=ts}
 requestAnimationFrame(loop);
}
/* ==================== Web Audio API 原創 8-bit 音效／旋律 ==================== */
let audioContext=null,sfxGain=null,musicGain=null,musicTimer=null,musicStep=0;
function syncAudio(){try{if(!audioContext)return;if(sfxGain)sfxGain.gain.setValueAtTime(game.settings.sound?1:0,audioContext.currentTime);if(musicGain)musicGain.gain.setValueAtTime(game.settings.music?1:0,audioContext.currentTime)}catch(e){}}
function unlockAudio(){try{if(!audioContext){const C=window.AudioContext||window.webkitAudioContext;if(C){audioContext=new C();sfxGain=audioContext.createGain();musicGain=audioContext.createGain();sfxGain.connect(audioContext.destination);musicGain.connect(audioContext.destination);syncAudio()}}if(audioContext?.state==='suspended'&&!game.paused)audioContext.resume().catch(()=>{})}catch(e){}}
function tone(freq,duration=.12,type='square',volume=.035,when=0,bend=0,bus='sfx'){
 try{if(!audioContext||(bus==='sfx'&&!game.settings.sound)||(bus==='music'&&!game.settings.music))return;
 const now=audioContext.currentTime+when,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(25,freq),now);if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(25,freq+bend),now+duration);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(bus==='music'?musicGain:sfxGain);o.start(now);o.stop(now+duration+.015);o.onended=()=>{o.disconnect();g.disconnect()};}catch(e){}
}
function fuzz(duration=.17,volume=.025){try{if(!audioContext||!game.settings.sound)return;let size=Math.ceil(audioContext.sampleRate*duration),buffer=audioContext.createBuffer(1,size,audioContext.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<size;i++){data[i]=(Math.random()*2-1)*Math.pow(1-i/size,1.9)}let src=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();src.buffer=buffer;filter.type='highpass';filter.frequency.value=280;gain.gain.value=volume;src.connect(filter);filter.connect(gain);gain.connect(sfxGain);src.start();src.onended=()=>{src.disconnect();filter.disconnect();gain.disconnect()}}catch(e){}}
function playSound(type){if(!game.settings.sound)return;unlockAudio();switch(type){
 case 'start':[392,494,587,784].forEach((f,i)=>tone(f,.12,'square',.04,i*.11));break;
 case 'turn':tone(570,.075,'square',.025);tone(740,.11,'square',.025,.085);break;
 case 'correct':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.032,i*.08));break;
 case 'wrong':tone(280,.12,'sawtooth',.027,0,-95);tone(180,.18,'square',.02,.12);break;
 case 'announce':tone(390,.07,'triangle',.02);tone(540,.09,'square',.018,.07);break;
 case 'chargeElectric':for(let i=0;i<9;i++)tone(220+i*75,.06,'sawtooth',.009,i*.044,90);break;
 case 'chargePsychic':for(let i=0;i<7;i++)tone(130+i*57,.11,'sine',.026,i*.065,100);break;
 case 'quick':tone(520,.22,'sawtooth',.045,0,-425);fuzz(.14,.02);break;
 case 'shock':for(let i=0;i<7;i++)tone(i%2?1040:340,.065,'square',.023,i*.038);break;
 case 'bolt':for(let i=0;i<13;i++)tone(i%2?1250:420,.07,'sawtooth',.025,i*.04,-220);fuzz(.4,.03);break;
 case 'volt':for(let i=0;i<12;i++)tone(240+i*100,.09,'sawtooth',.023,i*.047,-160);fuzz(.46,.048);break;
 case 'confusion':for(let i=0;i<6;i++)tone(440-i*35,.22,'sine',.02,i*.07,190);break;
 case 'psychic':for(let i=0;i<10;i++)tone(180+i*54,.16,'triangle',.027,i*.04,220);break;
 case 'aura':for(let i=0;i<8;i++)tone(170+i*86,.12,'sine',.026,i*.063,180);fuzz(.12,.01);break;
 case 'psystrike':for(let i=0;i<12;i++)tone(220+i*37,.13,'sawtooth',.025,i*.07,-100);fuzz(.5,.04);break;
 case 'hit':tone(130,.17,'sawtooth',.055,0,-100);tone(83,.26,'triangle',.04,.035,-50);fuzz(.22,.04);break;
 case 'hp':for(let i=0;i<6;i++)tone(220-i*16,.025,'triangle',.012,.11+i*.065);break;
 case 'draw':[392,494,587,494,392].forEach((f,i)=>tone(f,.16,'triangle',.025,i*.13));break;
 case 'victory':[523,659,784,1046,784,1046,1175].forEach((f,i)=>tone(f,.18,'square',.035,i*.12));break;
}}
const melody=[392,0,523,587,659,587,523,0,349,0,440,523,587,523,440,0,392,494,587,0,659,0,784,659,587,523,440,0,392,0,349,0];
function startMusic(){stopMusic();unlockAudio();musicStep=0;musicTimer=setInterval(()=>{if(!game.settings.music||game.paused||!audioContext||![S.BATTLE_INTRO,S.QUESTION,S.RETRY,S.ANSWER_FEEDBACK,S.SKILL_SELECT,S.TURN_END].includes(game.state))return;let f=melody[musicStep%melody.length];if(f){tone(f,.13,'triangle',.012,0,0,'music');if(musicStep%4===0)tone(f/2,.17,'sine',.012,.02,0,'music');}musicStep++},195)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
/* QA-friendly, non-mutating diagnostic snapshot, remains fully offline */
window.__battleQA={snapshot:()=>({state:game.state,index:game.index,active:game.active,attempt:game.attempt,reviewOnly:game.reviewOnly,koWinner:game.koWinner,questionId:currentEntry()?.q?.id??null,correctChoice:currentEntry()?.correct??null,answers:game.queue.map(e=>({id:e.q.id,team:e.team,result:e.result})),A:{hp:game.teams.A.hp,energy:game.teams.A.energy,stats:{...game.teams.A.stats,skills:[...game.teams.A.stats.skills]}},B:{hp:game.teams.B.hp,energy:game.teams.B.energy,stats:{...game.teams.B.stats,skills:[...game.teams.B.stats.skills]}}})};
try{game.settings.reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!game.paused&&!$('pauseBtn').disabled)$('pauseBtn').click()});
$('pauseMask').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('pauseBtn').click()}};
updateHud();overlayMenu();requestAnimationFrame(loop);
