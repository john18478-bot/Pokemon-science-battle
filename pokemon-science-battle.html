<script>
'use strict';
/* ==================== 教師可編輯題庫（10題、解說、分類） ==================== */
const QUESTION_BANK = [
 {id:1,topic:'消化系統',question:'身體將食物分解成較簡單的物質，以便被身體吸收，這個過程稱為甚麼？',options:['吸收','消化','排泄','呼吸'],correct:1,explain:'消化是將食物分解成較簡單物質的過程，讓身體能夠吸收當中的養分。'},
 {id:2,topic:'消化系統',question:'以下哪一項是保護消化系統的良好習慣？',options:['經常暴飲暴食','進食後立即進行劇烈運動','進食前先洗手','經常吃不潔的食物'],correct:2,explain:'進食前洗手有助減少病菌經食物進入消化系統的機會。'},
 {id:3,topic:'消化系統',question:'如果長期只吃肉類而不吃蔬菜，最容易出現以下哪種問題？',options:['因缺乏膳食纖維而便秘','骨骼立即停止生長','肺部無法吸入空氣','胃部不再分泌胃液'],correct:0,explain:'蔬菜含有膳食纖維，缺乏膳食纖維會增加便秘的機會。'},
 {id:4,topic:'呼吸系統',question:'以下哪種方法最有助保護呼吸系統？',options:['經常吸入二手煙','在多塵環境中不作防護','長期留在空氣不流通的地方','遠離煙霧，保持空氣流通'],correct:3,explain:'避免吸入煙霧和污染物，有助保護呼吸道及肺部。'},
 {id:5,topic:'呼吸系統',question:'咽在人體內的主要作用是甚麼？',options:['讓食物和空氣通過','分泌胃液','吸收食物的養分','進行氧氣與二氧化碳的交換'],correct:0,explain:'咽是食物和空氣都會經過的通道。'},
 {id:6,topic:'呼吸系統',question:'肺部的主要功能是甚麼？',options:['將食物分解','製造血液','進行氣體交換','儲存食物'],correct:2,explain:'肺部透過肺泡進行氣體交換，讓氧氣進入血液，並將二氧化碳排出。'},
 {id:7,topic:'消化系統',question:'胃液的主要作用是甚麼？',options:['吸收所有養分','幫助分解部分蛋白質','把食物直接轉化為血液','把氧氣輸送到身體各部分'],correct:1,explain:'胃液含有胃酸和消化酶，有助分解蛋白質。'},
 {id:8,topic:'消化系統',question:'經常飲用過熱的飲品，可能對身體造成甚麼傷害？',options:['令肺部失去彈性','令牙齒立即脫落','令腸道停止蠕動','灼傷口腔和食道'],correct:3,explain:'過熱的飲品可能灼傷口腔及食道黏膜。'},
 {id:9,topic:'呼吸系統',question:'吸氣和呼氣時，胸部會出現甚麼變化？',options:['吸氣時胸部收縮，呼氣時擴張','吸氣和呼氣時胸部都不會改變','吸氣時胸部擴張，呼氣時收縮','吸氣和呼氣時胸部都只會擴張'],correct:2,explain:'吸氣時胸腔容積增大，呼氣時胸腔容積減小。'},
 {id:10,topic:'消化系統',question:'在口腔裏，食物被牙齒咬碎後，會與甚麼混和？',options:['膽汁','唾液','胃液','血液'],correct:1,explain:'唾液能濕潤食物，當中的消化酶亦能開始分解澱粉。'}
];
const MOVESETS={
 A:[{id:'quick',name:'電光一閃',en:'Quick Attack',damage:14,cost:0,duration:2150,hit:.53},{id:'shock',name:'電擊',en:'Thunder Shock',damage:18,cost:1,duration:2800,hit:.60},{id:'bolt',name:'十萬伏特',en:'Thunderbolt',damage:23,cost:2,duration:3400,hit:.62},{id:'volt',name:'伏特攻擊',en:'Volt Tackle',damage:30,cost:4,duration:3950,hit:.72}],
 B:[{id:'confusion',name:'念力',en:'Confusion',damage:14,cost:0,duration:2500,hit:.60},{id:'psychic',name:'精神強念',en:'Psychic',damage:18,cost:1,duration:3180,hit:.62},{id:'aura',name:'波導彈',en:'Aura Sphere',damage:23,cost:2,duration:3360,hit:.69},{id:'psystrike',name:'精神擊破',en:'Psystrike',damage:30,cost:4,duration:4050,hit:.75}]
};
const S={MAIN_MENU:'MAIN_MENU',TEAM_SETUP:'TEAM_SETUP',BATTLE_INTRO:'BATTLE_INTRO',QUESTION:'QUESTION',RETRY:'RETRY',ANSWER_FEEDBACK:'ANSWER_FEEDBACK',SKILL_SELECT:'SKILL_SELECT',ATTACK:'ATTACK',DAMAGE:'DAMAGE',TURN_END:'TURN_END',GAME_OVER:'GAME_OVER',REVIEW:'REVIEW'};
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false});
const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
const mix=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const shuffle=arr=>{let copy=[...arr];for(let i=copy.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L='ABCD';
function makeTeam(id,name){return{id,name,mon:id==='A'?'比卡超':'超夢',hp:120,displayHp:120,energy:0,stats:{first:0,second:0,failed:0,attacks:0,totalDamage:0,skills:[]},fainted:false}}
const game={state:S.MAIN_MENU,outro:null,faintTime:0,teams:{A:makeTeam('A','A 組'),B:makeTeam('B','B 組')},queue:[],index:0,active:'A',attempt:0,wrongChoice:null,pendingAnswer:null,feedback:null,reviewOnly:false,koWinner:null,animation:null,paused:false,clock:0,particles:[],scenePulse:0,damageFloat:null,settings:{sound:true,music:false,reduced:false},selectedStarter:'random',initialNames:{A:'A 組',B:'B 組'}};
let lastTime=performance.now(),lastUiRefresh=0,canvasShake=0,toastHide=0;
function currentEntry(){return game.queue[game.index]}
function activeTeam(){return game.teams[game.active]}
function otherId(id){return id==='A'?'B':'A'}
function makeQueue(starter){
 let digest=shuffle(QUESTION_BANK.filter(q=>q.topic==='消化系統'));
 let breath=shuffle(QUESTION_BANK.filter(q=>q.topic==='呼吸系統'));
 let qa=shuffle([...digest.slice(0,3),...breath.slice(0,2)]),qb=shuffle([...digest.slice(3),...breath.slice(2)]);
 let entries=[];for(let i=0;i<5;i++)for(const team of [starter,otherId(starter)]){
  const q=(team==='A'?qa:qb)[i],options=shuffle(q.options.map((text,origin)=>({text,origin})));
  entries.push({team,q,options,correct:options.findIndex(o=>o.origin===q.correct),attempts:[],result:null});
 }return entries;
}
function setState(next){game.state=next;renderUI();updateHud()}
function startGame(){
 unlockAudio();game.teams.A=makeTeam('A',game.initialNames.A.trim().slice(0,18)||'A 組');game.teams.B=makeTeam('B',game.initialNames.B.trim().slice(0,18)||'B 組');

  $(tag+'Energy').innerHTML=Array.from({length:6},(_,i)=>`<span class="pip ${i<t.energy?'on':''}"></span>`).join('');
 }
 let turn=game.queue.length?Math.min(game.index+1,10):0;
 $('headerStatus').textContent=game.state===S.MAIN_MENU?'比卡超 VS 超夢 · 小五科學':`第 ${turn}/10 題　｜　${game.teams.A.name} 對戰 ${game.teams.B.name}`;

 const h=`科學問題 ${game.index+1}/10 · ${e.q.topic}`,sub=state===S.RETRY?'第一次答錯了！剩下最後一次機會；再次答對可得 1 能量，傷害為 75%。':'首次答對可得 2 能量，使用技能時造成 100% 傷害。';
 prompt(h,e.q.question,sub);

 setChoices(e.options.map((o,i)=>`<button class="choice ${i===game.wrongChoice?'wrong':''}" data-answer="${i}" ${i===game.wrongChoice?'disabled':''}><span class="key">${L[i]}</span><span>${esc(o.text)}</span></button>`).join(''));return;
 }
 if(state===S.ANSWER_FEEDBACK){
 let f=game.feedback;prompt(f.success?'答題成功！':'這題需要再溫習',`${f.success?'✓ 答對了！':'✕ 兩次都未答對。'} ${e.q.explain}`,`正確答案：${L[e.correct]}. ${e.options[e.correct].text}${f.success?`　｜　能量 +${f.gain}`:'　｜　本回合無法攻擊'}`);
 const label=game.reviewOnly?'下一題 ▶':f.success?'選擇絕招 ▶':'下一回合 ▶';setChoices(`<div class="panelActions"><span class="bigMessage" style="font-size:20px">${f.success?`能量 ${t.energy} / 6`:'再接再厲！'}</span>${actionBtn(label,'feedbackNext')}</div>`);return;
 }
 if(state===S.SKILL_SELECT){prompt('選擇技能',`${t.mon} 準備攻擊！` ,`可用能量：${t.energy}/6 ｜ ${game.feedback.first?'首次答對：100% 傷害':'第二次答對：75% 傷害'}`);
 setChoices(MOVESETS[game.active].map((s,i)=>{let available=t.energy>=s.cost,dmg=Math.round(s.damage*(game.feedback.first?1:.75));return `<button class="choice" data-move="${i}" ${!available?'disabled':''}><span class="key">${i+1}</span><span class="skillInfo"><span class="skillName">${esc(s.name)}</span><span class="skillMeta">傷害 ${dmg}　⚡ 能量 ${s.cost}${!available?' · 不足':''}</span></span></button>`}).join(''));return;
 }
 if(state===S.ATTACK||state===S.DAMAGE){let a=game.animation,m=a?.move;prompt('技能發動',`${t.mon} 使用了「${m?.name||''}」！` ,`攻擊 ${game.teams[otherId(game.active)].mon} ｜ 傷害 ${a?.damage||0} 點　｜　動畫可按右上角跳過`);setChoices(`<div class="panelActions"><span class="bigMessage" style="font-size:19px">${a?.hit?'命中！':'蓄力中…'}</span></div>`);return}

 if(state===S.GAME_OVER){prompt('對戰結果',game.koWinner?'其中一隻寶可夢的 HP 已歸零！':'10 道科學題目已經全部完成！','請查看最後戰績，也可重溫答錯的題目。');setChoices(`<div class="panelActions">${actionBtn('查看戰績','showResults')}</div>`);return}
 if(state===S.REVIEW){prompt('錯題重溫','複習兩組答錯的科學題目','按成績畫面的返回按鈕可查看對戰結果。');setChoices(`<div class="panelActions">${actionBtn('返回戰績','showResults')}</div>`)}
}
function selectAnswer(i){if(game.paused||![S.QUESTION,S.RETRY].includes(game.state)||game.pendingAnswer!==null||i===game.wrongChoice)return;game.pendingAnswer=i;renderUI()}
function confirmAnswer(){if(game.paused||![S.QUESTION,S.RETRY].includes(game.state)||game.pendingAnswer===null)return;
 let entry=currentEntry(),idx=game.pendingAnswer;game.pendingAnswer=null;entry.attempts.push(idx);game.attempt++;
 if(idx!==entry.correct&&game.attempt===1){game.wrongChoice=idx;setState(S.RETRY);playSound('wrong');toast('答錯了！還有一次機會。');return}
 let success=idx===entry.correct,first=success&&game.attempt===1,gain=success?(first?2:1):0;
 entry.result=success?(first?'first':'second'):'failed';let t=activeTeam();
 if(first)t.stats.first++;else if(success)t.stats.second++;else t.stats.failed++;
 if(!game.reviewOnly)t.energy=Math.min(6,t.energy+gain);
 game.feedback={success,first,gain:game.reviewOnly?0:gain};setState(S.ANSWER_FEEDBACK);playSound(success?'correct':'wrong');
 if(success)burst(game.active==='A'?315:735,game.active==='A'?295:160,34,success?['#fff1a1','#ffe055','#8bf5fe']:['#e2b0ef']);
}
function feedbackNext(){if(game.state!==S.ANSWER_FEEDBACK)return;if(game.feedback.success&&!game.reviewOnly){setState(S.SKILL_SELECT)}else{setState(S.TURN_END)}}
function chooseMove(i){if(game.state!==S.SKILL_SELECT||game.paused||game.animation)return;const m=MOVESETS[game.active][i],t=activeTeam();if(!m||t.energy<m.cost)return;
 const damage=Math.round(m.damage*(game.feedback.first?1:.75));t.energy-=m.cost;t.stats.skills.push(m.name);
 game.animation={move:m,from:game.active,to:otherId(game.active),damage,elapsed:0,duration:game.settings.reduced?Math.min(m.duration,1200):m.duration,hit:false,started:false,events:new Set()};
 setState(S.ATTACK);playSound('announce');
}
function applyHit(anim){if(anim.hit)return;anim.hit=true;let defender=game.teams[anim.to],attacker=game.teams[anim.from];
 let damage=Math.min(defender.hp,anim.damage),hpFrom=defender.hp;defender.hp=Math.max(0,defender.hp-damage);attacker.stats.attacks++;attacker.stats.totalDamage+=damage;
 anim.hitAt=anim.elapsed;anim.fromHP=hpFrom;anim.toHP=defender.hp;game.damageFloat={x:anim.to==='A'?290:728,y:anim.to==='A'?315:160,value:'-'+damage,born:game.clock,color:anim.from==='A'?'#ffe48a':'#eac3ff'};
 const pos=anim.to==='A'?[295,314]:[735,173];burst(pos[0],pos[1],game.settings.reduced?18:48,anim.from==='A'?['#ffdc4c','#fffcef','#71e4f4']:['#bd7bff','#f3caff','#8bcbff']);
 game.scenePulse=0.42;canvasShake=anim.move.damage>=23?14:7;playSound('hit');renderUI();
}
function finishAttack(){let a=game.animation;if(!a)return;if(!a.hit)applyHit(a);game.teams[a.to].displayHp=game.teams[a.to].hp;game.animation=null;game.scenePulse=0;
 if(game.teams[a.to].hp===0){game.teams[a.to].fainted=true;game.faintTime=game.clock;game.koWinner=a.from;endGame(true)}else setState(S.TURN_END);
}
function nextTurn(){if(game.state!==S.TURN_END||game.paused)return;
 game.index++;if(game.index>=game.queue.length){endGame(false);return}
 startQuestion();}
function startQuestion(){game.active=currentEntry().team;game.attempt=0;game.wrongChoice=null;game.pendingAnswer=null;game.feedback=null;setState(S.QUESTION);playSound('turn');}
function endGame(byKo){game.animation=null;game.paused=false;game.state=S.GAME_OVER;game.outro={started:game.clock,duration:2000};renderUI();showOverlay('');playSound('victory');
 const winner=winnerId();if(winner){if(!game.faintTime)game.faintTime=game.clock;burst(winner==='A'?298:716,winner==='A'?255:157,85,winner==='A'?['#ffdb3e','#fff4a3','#fff']:['#cb9eff','#9b67ec','#f5d7ff'])}else burst(500,160,70,['#eee5ff','#ffe1ac','#b4faff']);}
function winnerId(){if(game.koWinner)return game.koWinner;let a=game.teams.A,b=game.teams.B;if(a.hp!==b.hp)return a.hp>b.hp?'A':'B';if(a.stats.first!==b.stats.first)return a.stats.first>b.stats.first?'A':'B';return null}
function favoriteSkill(t){let counts={};for(const k of t.stats.skills)counts[k]=(counts[k]||0)+1;let ordered=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return ordered.length?`${ordered[0][0]} ×${ordered[0][1]}`:'未使用'}
function resultsHtml(){let a=game.teams.A,b=game.teams.B,winner=winnerId(),result=winner?`${esc(game.teams[winner].name)} 勝利！`:'勢均力敵！';let left=game.queue.length-game.queue.filter(e=>e.result!==null).length;
 const rows=[['首次答對題數','first'],['第二次答對題數','second'],['兩次答錯題數','failed'],['成功攻擊次數','attacks'],['總傷害','totalDamage']];
 return `<div class="modal wide"><h2>${winner?'🏆':'⚖️'} ${result}</h2><p>${game.koWinner?'HP 歸零，提前判定勝方。':'所有科學題目已作答，按剩餘 HP 比較；相同時比較首次答對題數。'}</p><table class="scoreTable"><thead><tr><th>成績</th><th>${esc(a.name)} · 比卡超</th><th>${esc(b.name)} · 超夢</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${a.stats[r[1]]}</td><td>${b.stats[r[1]]}</td></tr>`).join('')}<tr><td>剩餘 HP</td><td>${a.hp} / 120</td><td>${b.hp} / 120</td></tr><tr><td>最常使用的技能</td><td>${esc(favoriteSkill(a))}</td><td>${esc(favoriteSkill(b))}</td></tr></tbody></table>${left?`<p class="badgeText">尚有 ${left} 道科學題未完成。可繼續作答，不再發動攻擊。</p>`:''}<div class="modalActions">${left?actionBtn(`完成剩餘 ${left} 題`,'finishRemaining'):''}${actionBtn('錯題重溫','review','secondary')}${actionBtn('再次對戰','playAgain')}${actionBtn('返回主畫面','menu','secondary')}</div></div>`}

function finishRemaining(){if(game.state!==S.GAME_OVER)return;game.outro=null;game.reviewOnly=true;game.index++;if(game.index>=game.queue.length){showResults();return}showOverlay('');startQuestion();toast('餘下題目為科學重溫，不會再扣 HP。')}

function confirmRestart(){if(game.state===S.MAIN_MENU||game.state===S.TEAM_SETUP){overlayMenu();return}

function handleAction(action){switch(action){case 'menu':game.animation=null;game.outro=null;game.paused=false;game.reviewOnly=false;$('pauseMask').classList.remove('show');$('pauseBtn').textContent='⏸ 暫停';overlayMenu();break;
 case 'setup':overlaySetup();break;
 case 'begin':game.initialNames.A=$('teamAInput').value||'A 組';game.initialNames.B=$('teamBInput').value||'B 組';game.selectedStarter=$('starterSelect').value;startGame();break;
 case 'cancelAnswer':game.pendingAnswer=null;renderUI();break;case 'confirmAnswer':confirmAnswer();break;case 'feedbackNext':feedbackNext();break;case 'nextTurn':nextTurn();break;
 case 'showResults':showResults();break;case 'review':showReview();break;case 'playAgain':overlaySetup();break;case 'finishRemaining':finishRemaining();break;
 case 'cancelRestart':cancelRestart();break;case 'reallyRestart':game.animation=null;game.outro=null;game.paused=false;game.reviewOnly=false;$('pauseMask').classList.remove('show');$('pauseBtn').textContent='⏸ 暫停';overlaySetup();break;}}

$('restartBtn').onclick=confirmRestart;
$('pauseBtn').onclick=()=>{if([S.MAIN_MENU,S.TEAM_SETUP,S.GAME_OVER,S.REVIEW].includes(game.state))return;game.paused=!game.paused;$('pauseMask').classList.toggle('show',game.paused);$('pauseBtn').textContent=game.paused?'▶ 繼續':'⏸ 暫停';};
$('pauseMask').onclick=()=>{$('pauseBtn').click()};

window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(['1','2','3','4','a','b','c','d'].includes(e.key.toLowerCase())&&!e.repeat){let k=e.key.toLowerCase(),i=/^[1-4]$/.test(k)?Number(k)-1:'abcd'.indexOf(k);if([S.QUESTION,S.RETRY].includes(game.state))selectAnswer(i);else if(game.state===S.SKILL_SELECT)chooseMove(i)}if(e.key==='Escape'&&!$('overlay').classList.contains('hidden')){} });

function polygon(c,points,fill,stroke='#34374a',line=3){c.beginPath();c.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)c.lineTo(points[i][0],points[i][1]);c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=line;c.lineJoin='miter';c.stroke()}}

function line(c,points,color,width=3){c.beginPath();c.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)c.lineTo(points[i][0],points[i][1]);c.lineWidth=width;c.lineJoin='bevel';c.lineCap='square';c.strokeStyle=color;c.stroke()}
function circle(c,x,y,r,color){c.beginPath();c.arc(x,y,r,0,2*Math.PI);c.fillStyle=color;c.fill()}

function fighterPose(id){let t=game.teams[id];if(t.fainted)return 'faint';if(game.state===S.GAME_OVER||game.state===S.REVIEW){let w=winnerId();return w?(w===id?'victory':'faint'):'idle'}

function actorXY(id,a){let x=id==='A'?285:725,y=id==='A'?405:266,scale=id==='A'?2.04:1.48;
 let p=a?attackProgress(a):0;
 if(a&&a.from===id){
  if(a.move.id==='quick'){let f=p<.53?ease((p-.17)/.36):1-ease((p-.53)/.33);x+=f*377;y-=f*120}
  if(a.move.id==='volt'){let f=p<.72?ease((p-.45)/.27):1-ease((p-.74)/.19);x+=f*378;y-=f*120}
  if(a.move.id==='confusion'||a.move.id==='psychic'||a.move.id==='psystrike'||a.move.id==='aura'){x-=Math.sin(clamp((p-.2)*3)*Math.PI)*13;}
 }

  let strength=(1-clamp(since/520));x+=(id==='A'?-1:1)*Math.sin(since*.085)*12*strength;
  if(id==='A'&&a.move.id==='confusion'&&since<400)y-=Math.sin(since/400*Math.PI)*25;}
 return {x,y,scale}
}

/* ==================== Canvas particles and game loop ==================== */
function burst(x,y,n,colors){for(let i=0;i<n;i++){let angle=Math.random()*Math.PI*2,speed=40+Math.random()*225,life=.45+Math.random()*1;
 game.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-54,size:3+Math.floor(Math.random()*5),color:colors[i%colors.length],rot:Math.random()*5,vr:(Math.random()-.5)*9,life,maxLife:life});}
 if(game.particles.length>380)game.particles.splice(0,game.particles.length-380)}
function particleTick(dt){for(let i=game.particles.length-1;i>=0;i--){let p=game.particles[i];p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=150*dt/1000;p.vx*=.992;p.rot+=p.vr*dt/1000;p.life-=dt/1000;if(p.life<=0)game.particles.splice(i,1)}}
function fireEvent(a,label,threshold,fn,p){if(p>=threshold&&!a.events.has(label)){a.events.add(label);fn()}}
function stepAttack(dt){const a=game.animation;if(!a)return;a.elapsed+=dt;let p=attackProgress(a);
 fireEvent(a,'charge',.12,()=>{playSound(['quick','volt','shock','bolt'].includes(a.move.id)?'chargeElectric':'chargePsychic');let src=a.from==='A'?[290,289]:[716,150];burst(...src,13,a.from==='A'?['#fff2aa','#ffe54b']:['#e3aeff','#aa78ef'])},p);
 fireEvent(a,'launch',.41,()=>{playSound(a.move.id);let src=a.from==='A'?[362,279]:[666,172];burst(...src,18,a.from==='A'?['#fff1a7','#ffce2e','#9be9fb']:['#d08dfb','#7baaff','#f0c4fc'])},p);
 if(p>=a.move.hit&&!a.hit){applyHit(a);a.hitTime=game.clock}
 if(a.hit){let t=clamp((a.elapsed-a.hitAt)/Math.max(220,game.settings.reduced?170:570));game.teams[a.to].displayHp=mix(a.fromHP,a.toHP,ease(t))}
 if(a.elapsed>=a.duration)finishAttack();
}
function setBattleMsg(){let el=$('battleMsg'),a=game.animation;if(game.state===S.ATTACK&&a){el.textContent=`${game.teams[a.from].mon}使用了${a.move.name}！`;el.classList.toggle('show',a.elapsed<760)}else if(game.state===S.GAME_OVER&&game.outro){let w=winnerId();el.textContent=w?`${game.teams[w].name} 勝利！`:'勢均力敵！';el.classList.add('show')}else el.classList.remove('show')}
function loop(ts){const dt=Math.min(60,ts-lastTime||0);lastTime=ts;
 if(!game.paused){game.clock+=dt;particleTick(dt);game.scenePulse=Math.max(0,game.scenePulse-dt*.0007);canvasShake=Math.max(0,canvasShake-dt*.028);
 if(game.state===S.BATTLE_INTRO&&game.clock>=game.introEnd)startQuestion();
 if(game.state===S.ATTACK)stepAttack(dt);
 if(game.outro&&game.clock-game.outro.started>=game.outro.duration)showResults();
 if(toastHide&&game.clock>toastHide){$('toast').classList.remove('show');toastHide=0}
 }
 renderWorld(game.clock);setBattleMsg();if(ts-lastUiRefresh>60){updateHud();lastUiRefresh=ts}
 requestAnimationFrame(loop);
}
/* ==================== Web Audio API 原創 8-bit 音效／旋律 ==================== */
let audioContext=null,musicTimer=null,musicStep=0;
function unlockAudio(){try{if(!audioContext){let C=window.AudioContext||window.webkitAudioContext;if(C)audioContext=new C()}if(audioContext?.state==='suspended')audioContext.resume().catch(()=>{})}catch(e){/* silent fallback */}}
function tone(freq,duration=.12,type='square',volume=.035,when=0,bend=0){try{if(!audioContext||!game.settings.sound)return;let now=audioContext.currentTime+when,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(25,freq),now);if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(25,freq+bend),now+duration);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(audioContext.destination);o.start(now);o.stop(now+duration+.015)}catch(e){}}
function fuzz(duration=.17,volume=.025){try{if(!audioContext||!game.settings.sound)return;let size=Math.ceil(audioContext.sampleRate*duration),buffer=audioContext.createBuffer(1,size,audioContext.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<size;i++){data[i]=(Math.random()*2-1)*Math.pow(1-i/size,1.9)}let src=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();src.buffer=buffer;filter.type='highpass';filter.frequency.value=280;gain.gain.value=volume;src.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);src.start()}catch(e){}}
function playSound(type){if(!game.settings.sound)return;unlockAudio();switch(type){
 case 'start':[392,494,587,784].forEach((f,i)=>tone(f,.12,'square',.04,i*.11));break;
 case 'turn':tone(570,.075,'square',.025);tone(740,.11,'square',.025,.085);break;
 case 'correct':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.032,i*.08));break;
 case 'wrong':tone(280,.12,'sawtooth',.027,0,-95);tone(180,.18,'square',.02,.12);break;
 case 'announce':tone(390,.07,'triangle',.02);tone(540,.09,'square',.018,.07);break;
 case 'chargeElectric':for(let i=0;i<9;i++)tone(220+i*75,.06,'sawtooth',.009,i*.044,90);break;
 case 'chargePsychic':for(let i=0;i<7;i++)tone(130+i*57,.11,'sine',.026,i*.065,100);break;
 case 'quick':tone(520,.22,'sawtooth',.045,0,-425);fuzz(.14,.02);break;

 case 'confusion':for(let i=0;i<6;i++)tone(440-i*35,.22,'sine',.02,i*.07,190);break;
 case 'psychic':for(let i=0;i<10;i++)tone(180+i*54,.16,'triangle',.027,i*.04,220);break;
 case 'aura':for(let i=0;i<8;i++)tone(170+i*86,.12,'sine',.026,i*.063,180);fuzz(.12,.01);break;
 case 'psystrike':for(let i=0;i<12;i++)tone(220+i*37,.13,'sawtooth',.025,i*.07,-100);fuzz(.5,.04);break;
 case 'hit':tone(130,.17,'sawtooth',.055,0,-100);tone(83,.26,'triangle',.04,.035,-50);fuzz(.22,.04);break;
 case 'victory':[523,659,784,1046,784,1046,1175].forEach((f,i)=>tone(f,.18,'square',.035,i*.12));break;
}}
const melody=[392,0,523,587,659,587,523,0,349,0,440,523,587,523,440,0,392,494,587,0,659,0,784,659,587,523,440,0,392,0,349,0];
function startMusic(){stopMusic();unlockAudio();musicStep=0;musicTimer=setInterval(()=>{if(!game.settings.music||game.paused||!audioContext||![S.BATTLE_INTRO,S.QUESTION,S.RETRY,S.ANSWER_FEEDBACK,S.SKILL_SELECT,S.TURN_END].includes(game.state))return;let f=melody[musicStep%melody.length];if(f){let was=game.settings.sound;game.settings.sound=true;tone(f,.13,'triangle',.007);if(musicStep%4===0)tone(f/2,.17,'sine',.007,.02);game.settings.sound=was;}musicStep++},195)}

/* QA-friendly, non-mutating diagnostic snapshot, remains fully offline */
window.__battleQA={snapshot:()=>({state:game.state,index:game.index,active:game.active,attempt:game.attempt,reviewOnly:game.reviewOnly,koWinner:game.koWinner,questionId:currentEntry()?.q?.id??null,correctChoice:currentEntry()?.correct??null,answers:game.queue.map(e=>({id:e.q.id,team:e.team,result:e.result})),A:{hp:game.teams.A.hp,energy:game.teams.A.energy,stats:{...game.teams.A.stats}},B:{hp:game.teams.B.hp,energy:game.teams.B.energy,stats:{...game.teams.B.stats}}})};
updateHud();overlayMenu();requestAnimationFrame(loop);
